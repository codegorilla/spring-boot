<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: mainLayout(~{::title}, ~{::main})}">
<head>
    <title>Users</title>
</head>
<body>
    <main class="flex-grow-1 overflow-auto p-4">
        <div class="container my-4">
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th scope="col">First Name</th>
                            <th scope="col">Last Name</th>
                            <th scope="col">Email Address</th>
                            <th scope="col">Organization</th>
                            <th scope="col">Department</th>
                            <th scope="col">Job Title</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.firstName}"></td>
                            <td th:text="${user.lastName}"></td>
                            <td th:text="${user.emailAddress}"></td>
                            <td th:text="${user.userProfile.organization}"></td>
                            <td th:text="${user.userProfile.department.name}"></td>
                            <td th:text="${user.userProfile.jobTitle}"></td>
                            <td>
                                <a th:href="@{/users/{id}(id=${user.id})}" class="btn btn-primary btn-sm">View</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
