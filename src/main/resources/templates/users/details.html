<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: mainLayout(~{::title}, ~{::section})}">
<head>
    <title>Users</title>
</head>
<body>
    <section>
        <!-- sidebar -->
        <nav class="nav flex-column">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link active" href="/dashboard">
                        Products
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/settings">
                        Settings
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/profile">
                        Profile
                    </a>
                </li>
            </ul>
        </nav>

        <div class="container my-4">
            <div class="row gy-3 mb-3">
                <div class="col-sm-3">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Name</h5>
                            <p class="card-text" th:text="|${user.firstName} ${user.lastName}|">John Doe</p>
                        </div>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Email Address</h5>
                            <p class="card-text" th:text="${user.emailAddress}">john.doe@example.org</p>
                        </div>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Created On</h5>
                            <p class="card-text" th:text="${#temporals.format(user.createdDate, 'MMM d, yyyy')} + ' UTC'">Jan 1, 2000 UTC</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row gy-3 mb-3">
                <div class="col-sm-3">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Organization</h5>
                            <p class="card-text" th:text="${user.userProfile?.organization} ?: 'Not set'"></p>
                        </div>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Department</h5>
                            <p class="card-text" th:text="${user.userProfile?.department?.name} ?: 'Not set'"></p>
                        </div>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Job Title</h5>
                            <p class="card-text" th:text="${user.userProfile?.jobTitle} ?: 'Not set'"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

     <!-- roles -->
     <!-- Put checkboxes here for each role -->

    </section>
</body>
</html>
