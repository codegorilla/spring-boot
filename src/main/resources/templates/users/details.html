<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: mainLayout(~{::title}, ~{::main})}">
<head>
    <title>Users</title>
</head>
<body>
    <main class="flex-grow-1 overflow-auto p-4">

        <!-- cards-->
        <div class="container my-4">
            <div class="row gy-3 mb-3">
                <div class="col-sm-3">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Name</h5>
                            <p class="card-text" th:text="|${user.firstName} ${user.lastName}|">John Doe</p>
                        </div>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Email Address</h5>
                            <p class="card-text" th:text="${user.emailAddress}">john.doe@example.org</p>
                        </div>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Created On</h5>
                            <p class="card-text" th:text="${#temporals.format(user.createdDate, 'MMM d, yyyy')} + ' UTC'">Jan 1, 2000 UTC</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row gy-3 mb-3">
                <div class="col-sm-3">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Organization</h5>
                            <p class="card-text" th:text="${user.userProfile?.organization} ?: 'Not set'"></p>
                        </div>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Department</h5>
                            <p class="card-text" th:text="${user.userProfile?.department?.name} ?: 'Not set'"></p>
                        </div>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Job Title</h5>
                            <p class="card-text" th:text="${user.userProfile?.jobTitle} ?: 'Not set'"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- roles -->
        <form th:action="@{/users/{id}/roles(id=${user.id})}" method="post" class="mt-4">
            <h2 class="h5">Roles</h2>

            <div class="form-check" th:each="role : ${allRoles}">
                <input class="form-check-input" type="checkbox"
                       name="roleIds"
                       th:value="${role.id}"
                       th:id="|role-${role.id}|"
                       th:checked="${selectedRoleIds.contains(role.id)}">
                <label class="form-check-label" th:for="|role-${role.id}|" th:text="${role.name}">ADMIN</label>
            </div>

            <div class="mt-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save</button>
                <a th:href="@{/users}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>

    </main>
</body>
</html>
